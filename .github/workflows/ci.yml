name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check . --select E9,F63,F7,F82 --output-format=text
          ruff check . --statistics

      - name: Format check with ruff
        run: |
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with pytest
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

      - name: Coverage gate on core data layer
        run: |
          python -m pytest tests/ -q --no-header --cov=app/db --cov-fail-under=85 --cov-report=term-missing

  frontend-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Rebuild committed dist and verify it matches sources
        run: |
          npm run build
          if [ -n "$(git status --porcelain app/static/dist)" ]; then
            echo "::error::app/static/dist is out of sync with app/static/js and app/static/css — run 'npm run build' and commit the result."
            git status --porcelain app/static/dist
            exit 1
          fi
          echo "Committed dist is up to date."

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for broken links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config /dev/null
            --no-progress
            --exclude 'https?://localhost'
            --exclude 'https?://127\.0\.0\.1'
            --exclude 'https?://.*shields\.io'
            --exclude 'https?://.*example\.com'
            --exclude 'https?://.*test\.org'
            --exclude 'https?://.*yourusername.*'
            --exclude 'https?://.*your-username.*'
            --exclude 'https?://.*\{.*\}.*'
            --exclude 'https?://.*static\.streamlit\.io'
            --exclude 'https?://.*via\.placeholder\.com'
            '**/*.md' '**/*.py' '**/*.html'
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run bandit security scan
        run: bandit -r . -x ./venv,./__pycache__,'./Recommendation Systems',./tests,./scripts -l -s B110,B101

      - name: Run pip-audit dependency scan
        run: pip-audit -r requirements.txt --strict

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet

      - name: Build image
        run: docker build -t booktale:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: booktale:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
