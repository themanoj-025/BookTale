# Book-Tale — Nginx reverse proxy (optional; mounted into the compose
# `nginx` service as /etc/nginx/conf.d/default.conf).
#
# Proxies HTTP :80 to the Flask/Gunicorn app container (service `app` on
# :5000). Add `server` blocks + TLS certs here for production HTTPS.

upstream booktale_app {
    server app:5000;
}

server {
    listen 80;
    server_name _;

    # Health endpoint passthrough (used by orchestrator probes)
    location = /healthz {
        proxy_pass http://booktale_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://booktale_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Flask session cookies over HTTP in dev — comment out when TLS is on
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Security headers (see docs/adr/0008-health-endpoints-security-headers.md)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
